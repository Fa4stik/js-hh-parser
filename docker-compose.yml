version: '3.8'

services:
  model:
    build:
      context: .
      dockerfile: Dockerfile.model
    ports:
      - "6380:6380"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6380/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    env_file:
      - .env
    volumes:
      - ./src/context:/app/src/context
    depends_on:
      model:
        condition: service_healthy
    environment:
      - AI_URL=http://model:6380
