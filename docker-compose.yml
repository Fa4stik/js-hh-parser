version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:7b\"}' && echo 'Model pulled'"
    restart: "no"

  model:
    build:
      context: .
      dockerfile: Dockerfile.model
    ports:
      - "6380:6380"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6380/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    env_file:
      - .env
    volumes:
      - ./src/context:/app/src/context
    depends_on:
      model:
        condition: service_healthy
    environment:
      - AI_URL=http://model:6380

volumes:
  ollama_data:
